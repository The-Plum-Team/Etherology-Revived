name: build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Python tooling
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test E2E tooling
        run: >-
          python -B -m unittest
          scripts/e2e/test_client.py
          scripts/e2e/test_evidence.py
          scripts/e2e/test_forge_client.py
          scripts/e2e/test_forge_evidence.py
          scripts/e2e/test_forge_server.py
          scripts/e2e/test_forge_server_anchor_integration.py
          scripts/e2e/test_forge_server_launch_anchor.py
          scripts/e2e/test_forge_server_launch_watchdog.py
          scripts/e2e/test_forge_server_contract_v21.py
          scripts/e2e/test_forge_server_slitherite_evidence_v21.py
          scripts/e2e/test_macos_guarded_java.py
          scripts/baseline/tests/test_macos_memory_guard.py
      - name: Validate support catalog
        run: |
          python -B -m unittest scripts/release/test_validate_support_catalog.py
          python -B scripts/release/validate_support_catalog.py

  fabric-and-forge-gates:
    name: Fabric build and transitional Forge gates
    needs: tooling
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Test and build common and Fabric
        run: >-
          ./gradlew --no-daemon
          :common:1.20.1:test
          :common:1.20.1:build
          :fabric:1.20.1:test
          :fabric:1.20.1:build
      - name: Run and verify Fabric datagen
        run: |
          ./gradlew --no-daemon :fabric:1.20.1:runDatagen
          python -B -m unittest scripts/datagen/test_verify_recipe_advancements.py
          python -B scripts/datagen/verify_recipe_advancements.py build/datagen/1.20.1
      - name: Build and isolate the Fabric E2E harness
        run: >-
          ./gradlew --no-daemon
          :fabric:1.20.1:buildE2eHarness
          :fabric:1.20.1:verifyE2eHarnessIsolation
      - name: Validate Forge storage parity, E2E isolation, and the closed release gate
        run: >-
          ./gradlew --no-daemon
          :forge:1.20.1:test
          :forge:1.20.1:compileJava
          :forge:1.20.1:e2eHarnessTest
          :forge:1.20.1:validateForgeBootstrapInputs
          :forge:1.20.1:validateForgeEtherItemMilestone
          :forge:1.20.1:validateForgeStorageFoundationMilestone
          :forge:1.20.1:validateForgePersistentStorageMenuCoreMilestone
          :forge:1.20.1:validateForgeStorageParityMilestone
          :forge:1.20.1:verifyE2eHarnessArtifact
          :forge:1.20.1:verifyE2eUnderTestIsolation
          :forge:1.20.1:verifyForgePortGateClosed
