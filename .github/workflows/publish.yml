name: publish (release gate closed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-22.04
    steps:
      - name: Refuse incomplete release
        run: |
          echo "Etherology Revived publishing is disabled until every release-matrix lane passes its native gameplay and E2E gates."
          exit 1
