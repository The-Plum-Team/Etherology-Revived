modLoader="javafml"
loaderVersion="${forge_loader_range}"
license="LGPL-2.1-only"

[[mods]]
modId="etherology_e2e_server_probe"
version="${version}"
displayName="Etherology Forge Dedicated-Server Probe"
authors="The Plum Team"
description='''
Server-only black-box verification for Etherology's shared game-event registry and tags.
This probe is never a release dependency or publication artifact.
'''

[[dependencies.etherology_e2e_server_probe]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.etherology_e2e_server_probe]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.etherology_e2e_server_probe]]
modId="etherology"
mandatory=true
versionRange="[${version}]"
ordering="AFTER"
side="SERVER"
